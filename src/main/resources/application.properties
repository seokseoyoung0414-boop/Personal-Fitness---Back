spring.application.name=NodySpring
# =============================
# = MariaDB(use JAP)
# =============================
spring.datasource.url=#{mariaDB}
spring.datasource.username=#{root}
spring.datasource.password=#{passwd}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================
# = MongoDB
# =============================
spring.data.mongodb.uri=#{mongoDB}

#recaptcha
recaptcha.secret=#{secretKey}

#JWT
jwt.secretkey=#{secretKey}

#coolSMS
coolsms.api_key=#{apiKey}
coolsms.api_secret=#{apiSecret}
coolsms.sender_phone=#{sender}

#weather
weather.api-key=#{apiKey}


spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

server.forward-headers-strategy=native
# =============================
# = server port
# =============================
server.port=8080

# Redis ?? ?? ??
spring.data.redis.host=#{redis}
spring.data.redis.port=13640
spring.data.redis.password=#{passwd}
