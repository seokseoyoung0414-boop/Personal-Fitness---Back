spring.application.name=NodySpring

# =============================
# = MariaDB(use JPA)
# =============================
spring.datasource.url=${MARIADB_URL}
spring.datasource.username=${MARIADB_USER}
spring.datasource.password=${MARIADB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================
# = MongoDB
# =============================
spring.data.mongodb.uri=${MONGO_URI}

# recaptcha
recaptcha.secret=${RECAPTCHA_SECRET}

# JWT
jwt.secretkey=${JWT_SECRET}

# coolSMS
coolsms.api_key=${COOLSMS_API_KEY}
coolsms.api_secret=${COOLSMS_API_SECRET}
coolsms.sender_phone=${COOLSMS_SENDER}

# weather
weather.api-key=${WEATHER_API_KEY}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB

server.forward-headers-strategy=native

# =============================
# = server port
# =============================
server.port=8080

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=10010
spring.data.redis.password=${REDIS_PASSWORD}